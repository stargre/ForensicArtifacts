gpus: 2,3
flag: train
log_dir: ./log/dino_lora/token_pooling/token_pooling_ablation/cls
checkpoint_path: null
save_dir: /mnt/data2/zhiyu/checkpoints/dino_lora/token_pooling/token_pooling_ablation/cls
resume: false
model:
  repo_path: /mnt/data3/zhiyu/dino_clip/dinov2_repo
  backbone_name: dinov2_vitb14_reg
  pretrained: true
  freeze_backbone: true
  unfreeze_last_n_blocks: 0
  unfreeze_norm: false
  enable_attention_pooling: false
  attention_hidden_dim: 256
  pooling_type: cls
  hidden_dim: 512
  dropout: 0.2
  num_classes: 1
lora:
  enabled: true
  r: 16
  alpha: 16
  dropout: 0.0
  target_modules:
  - attn.qkv
  - attn.proj
  head_keywords:
  - classifier
data:
  image_size: 224
  strict_mode: false
  mean:
  - 0.485
  - 0.456
  - 0.406
  std:
  - 0.229
  - 0.224
  - 0.225
train_dataset:
  path: /mnt/data2/zhiyu/Data/small_openmmsec/train_test.json
  target_domains: null
  target_labels: null
  target_mani_types: null
val_dataset:
  path: /mnt/data2/zhiyu/Data/small_openmmsec/val_test.json
  target_domains: null
  target_labels: null
  target_mani_types: null
test_datasets:
  path: /mnt/data2/zhiyu/Data/small_openmmsec/test_large.json
  target_domains: null
  target_labels: null
  target_mani_types: null
training:
  epochs: 10
  batch_size: 128
  grad_clip: 1.0
  val_control:
    min_delta: 0.0005
    rollback_on_no_improve: true
    clear_optimizer_on_rollback: true
  optimizer:
    name: AdamW
    lr: 0.0001
    head_lr: 0.0001
    lora_lr: 0.0001
    backbone_lr: 1.0e-05
    weight_decay: 0.0001
    betas:
    - 0.9
    - 0.999
    sam:
      enabled: true
      type: asam
      rho: 0.2
      eta: 0.0
  scheduler:
    type: plateau
    name: ReduceLROnPlateau
    mode: max
    factor: 0.5
    patience: 0
    threshold: 0.0005
    threshold_mode: abs
    cooldown: 0
    min_lr: 1.0e-06
  early_stopping:
    enabled: true
    patience: 5
    min_delta: 0.0005
    monitor: val_control_score
ema:
  enabled: false
  use_ema_for_val: true
  save_ema: true
  decay: 0.999
system:
  device: cuda
  num_workers: 8
  pin_memory: true
  seed: 42
distributed:
  world_size: 1
  local_rank: -1
  dist_backend: nccl
  dist_url: env://
logging:
  print_freq: 20
  save_freq: 5
