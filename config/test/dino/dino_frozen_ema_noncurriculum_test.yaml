# ==================== 运行控制 ====================
gpus: "4"
flag: test
log_dir: "./log/test/dino_baseline_domain_ema_curriculum"
checkpoint_path: "/mnt/data3/zhiyu/ForensicArtifacts/checkpoints/dino_baseline_domain_ema_nocurriculum/best_model.pth"

# ==================== 模型配置 ====================
model:
  repo_path: "/mnt/data3/zhiyu/dino_clip/dinov2_repo"
  backbone_name: "dinov2_vitb14_reg"
  pretrained: true          # 与训练一致
  freeze_backbone: true     # 与训练一致
  pooling_type: "cls_patch_mean"
  hidden_dim: 512
  dropout: 0.15             # 与训练一致（0.15）
  num_classes: 1

# ==================== 数据配置 ====================
data:
  image_size: 224
  strict_mode: false
  mean: [0.485, 0.456, 0.406]
  std: [0.229, 0.224, 0.225]

# ==================== 测试集 ====================
test_datasets:
  path: "/mnt/data2/zhiyu/Data/small_openmmsec/test_medium.json"
  target_domains: null
  target_labels: null
  target_mani_types: null

# ==================== 测试参数 ====================
testing:
  batch_size: 32
  threshold: null           # 自动搜索最优阈值
  save_predictions: true
  prediction_save_path: "./log/test/dino_baseline_domain_ema_nocurriculum/test_predictions.csv"

# ==================== EMA 配置（用于测试）====================
ema:
  enabled: true             # 表示 checkpoint 中包含 EMA 模型
  use_ema_for_test: true    # 新增：明确指示测试时使用 EMA 模型

# ==================== 系统配置 ====================
system:
  device: "cuda"
  num_workers: 8
  pin_memory: true
  seed: 42

# ==================== 日志配置 ====================
logging:
  print_freq: 20