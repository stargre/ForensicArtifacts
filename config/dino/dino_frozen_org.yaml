# ==================== 运行控制 ====================
gpus: "4,5"
flag: train

log_dir: "./log/dino_orth_2"
checkpoint_path: null
save_dir: "./checkpoints/dino_orth_2"
resume: false

# ==================== 模型配置 ====================
model:
  repo_path: "/mnt/data3/zhiyu/dino_clip/dinov2_repo"

  # with registers 版本
  backbone_name: "dinov2_vitb14_reg"

  pretrained: true
  freeze_backbone: true

  # 特征聚合方式
  pooling_type: "cls_patch_mean"

  # shared feature 维度
  shared_dim: 512

  # 两个分支的特征维度
  forgery_dim: 256
  domain_dim: 256

  # projector 隐藏层
  forgery_hidden_dim: 512
  domain_projector_hidden_dim: 512

  # 两个 head 的隐藏层维度
  hidden_dim: 128
  domain_hidden_dim: 64

  dropout: 0.2
  num_domains: 4

# ==================== 数据配置 ====================
data:
  image_size: 224
  strict_mode: false

  mean: [0.485, 0.456, 0.406]
  std: [0.229, 0.224, 0.225]

# ==================== 数据集 ====================
train_dataset:
  path: "/mnt/data2/zhiyu/Data/small_openmmsec/train_medium.json"
  target_domains: null
  target_labels: null
  target_mani_types: null

val_dataset:
  path: "/mnt/data2/zhiyu/Data/small_openmmsec/val_medium.json"
  target_domains: null
  target_labels: null
  target_mani_types: null

test_datasets:
  path: "/mnt/data2/zhiyu/Data/small_openmmsec/test_medium.json"
  target_domains: null

# ==================== 训练参数 ====================
training:
  epochs: 20
  batch_size: 16
  grad_clip: 1.0

  # loss 权重
  domain_loss_weight: 0.15
  orth_loss_weight: 0.03

  optimizer:
    name: "AdamW"
    lr: 1.0e-4
    weight_decay: 1.0e-4
    betas: [0.9, 0.999]

  scheduler:
    name: "CosineAnnealingLR"
    T_max: 30
    eta_min: 1.0e-6

  early_stopping:
    enabled: true
    patience: 6
    min_delta: 0.0005
    monitor: "val_auc"

# ==================== 系统配置 ====================
system:
  device: "cuda"
  num_workers: 8
  pin_memory: true
  seed: 42

distributed:
  world_size: 1
  local_rank: -1
  dist_backend: "nccl"
  dist_url: "env://"

logging:
  print_freq: 20
  save_freq: 5