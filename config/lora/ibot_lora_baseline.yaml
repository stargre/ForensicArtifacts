# ==================== 运行控制 ====================
gpus: "0,1"
flag: train

log_dir: "./log/ibot_lora/baseline/"
checkpoint_path: null
save_dir: "/mnt/data2/zhiyu/checkpoints/ibot_lora/baseline/"
resume: false

# ==================== 模型配置 ====================
model:
  backbone_type: "ibot"

  # iBOT 官方仓库路径，里面应有 models/
  repo_path: "/mnt/data3/zhiyu/ibot"

  # iBOT ViT:
  # vit_tiny / vit_small / vit_base / vit_large
  backbone_name: "vit_base"
  patch_size: 16

  # iBOT 预训练权重
  backbone_checkpoint: "/mnt/data3/zhiyu/pretrained/ibot_vit_base_teacher.pth"

  # 常见 iBOT checkpoint 里 teacher 更适合作为下游初始化
  checkpoint_key: "teacher"
  strict_load: false

  pretrained: true

  freeze_backbone: true
  unfreeze_last_n_blocks: 0
  unfreeze_norm: false

  enable_attention_pooling: true
  attention_hidden_dim: 256

  pooling_type: "cls_patch_mean"
  hidden_dim: 512
  dropout: 0.2
  num_classes: 1

# ==================== LoRA 配置 ====================
lora:
  enabled: true

  r: 16
  alpha: 16
  dropout: 0.0

  target_modules:
    - "attn.qkv"
    - "attn.proj"

  head_keywords:
    - "classifier"

# ==================== 数据配置 ====================
data:
  image_size: 224
  strict_mode: false

  mean: [0.485, 0.456, 0.406]
  std: [0.229, 0.224, 0.225]

train_dataset:
  path: "/mnt/data2/zhiyu/Data/small_openmmsec/train_test.json"
  target_domains: null
  target_labels: null
  target_mani_types: null

val_dataset:
  path: "/mnt/data2/zhiyu/Data/small_openmmsec/val_test.json"
  target_domains: null
  target_labels: null
  target_mani_types: null

test_datasets:
  path: "/mnt/data2/zhiyu/Data/small_openmmsec/test_large.json"
  target_domains: null
  target_labels: null
  target_mani_types: null

# ==================== 训练参数 ====================
training:
  epochs: 10
  batch_size: 128
  grad_clip: 1.0

  val_control:
    min_delta: 0.0005
    rollback_on_no_improve: true
    clear_optimizer_on_rollback: true

  optimizer:
    name: "AdamW"

    lr: 0.0001
    head_lr: 0.0001
    lora_lr: 0.0001
    backbone_lr: 0.00001

    weight_decay: 0.0001
    betas: [0.9, 0.999]

    sam:
      enabled: true
      type: "asam"
      rho: 0.2
      eta: 0.01

  scheduler:
    type: "plateau"
    name: "ReduceLROnPlateau"
    mode: "max"
    factor: 0.5
    patience: 0
    threshold: 0.0005
    threshold_mode: "abs"
    cooldown: 0
    min_lr: 0.000001

  early_stopping:
    enabled: true
    patience: 5
    min_delta: 0.0005
    monitor: "val_control_score"

# ==================== EMA 配置 ====================
ema:
  enabled: false
  use_ema_for_val: true
  save_ema: true
  decay: 0.999

# ==================== 系统配置 ====================
system:
  device: "cuda"
  num_workers: 8
  pin_memory: true
  seed: 42

distributed:
  world_size: 1
  local_rank: -1
  dist_backend: "nccl"
  dist_url: "env://"

logging:
  print_freq: 20
  save_freq: 5